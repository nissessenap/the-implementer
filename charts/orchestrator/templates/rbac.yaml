# The orchestrator's whole cluster access: create a Job, and read the Jobs and the
# Pods in its own namespace. Nothing cluster-scoped and no Secrets — ADR 0005 moved
# the sandbox's credential to the proxy, which deleted the per-run Secret, its
# ownerReference and its orphan sweep from this component.
#
# On Jobs, none of the four verbs is decoration: `get` is what a swallowed
# AlreadyExists is worth reading after, `list` is ADR 0004's restart-is-a-relist,
# and `watch` is what notices the one ending that leaves no pod behind — when
# `activeDeadlineSeconds` expires the Job controller deletes the active pods, so the
# Job's condition is the only record of it.
#
# On Pods it is `list` alone. Both result channels are pod-level (the blob is the
# container's terminated `message`, the resolved digest is its `imageID`) but the
# Job's condition is what triggers a report, so the pod is read on demand and never
# watched. That it is read-only is load-bearing rather than minimalism: with no way
# to write to a Pod the informer cannot mark a run as reported in Kubernetes, which
# is why the exactly-once record is the issue comment itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}

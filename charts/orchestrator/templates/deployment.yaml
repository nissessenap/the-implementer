{{- /* Rendered only when there is an image to run, and that is the seam rather
       than a `webhook.enabled` flag: with no image this chart is the Job template,
       the ServiceAccount and the Role alone, which is exactly what the command
       line needs — and what e2e stages 80 and 90 install. One value decides it,
       so there is no pair that can disagree. */}}
{{- if .Values.image }}
{{- if not .Values.webhook.secretName }}
{{- /* An unset secret is an open trigger rather than a broken webhook — see
       orchestrator/webhook.go. Refused here as well as at boot, so it fails
       before the install rather than as a CrashLoopBackOff. */}}
{{- fail "webhook.secretName is required: it is the Secret holding the webhook secret, and an unset secret is an open trigger rather than a broken one" }}
{{- end }}
# The webhook front-end (ADR 0004). It creates one Job per labelled issue and is
# then done with it — no queue, no worker, no waiting on the run.
#
# Not under gVisor, and it holds no GitHub credential at all: the authorization is
# two clauses on the payload, and the refusal is silent on purpose, so there is
# nothing here that could write to GitHub. The informer half is the one that does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  # ponytail: one, and not a value. Idempotency is the Job name plus a swallowed
  # AlreadyExists, so a second replica would not create a second run — but the
  # informer shares this binary's future and ADR 0004 puts its leader election on
  # a later ticket. A knob here would be an invitation to run two before then, so
  # this becomes a value when leader election lands and not before.
  replicas: 1
  selector:
    # `component` and not `app` alone: every sandbox pod carries app=implementer
    # (orchestrator/job.go's run label), so a release *named* implementer would make
    # the Service below select the run pods too and load-balance deliveries into
    # sandboxes. Immutable on an existing Deployment, so changing it is a reinstall.
    matchLabels: { app: {{ .Release.Name }}, component: webhook }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}, component: webhook }
      annotations:
        # Rolls the pod when the Job template changes, because the file is read
        # once at boot: without this an operator edits the sandbox posture, helm
        # reports success, and every run keeps using the old PodSpec.
        checksum/job-template: {{ include (print $.Template.BasePath "/job-template.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # the nonroot user ko's base image ships
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: orchestrator
          image: "{{ .Values.image }}"
          # Not a value: ko tags by a hash of the binary, so nothing newer ever
          # appears under the reference above.
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            # The namespace it creates runs in, which is ADR 0004's load-bearing
            # configuration item — it is the uniqueness scope for the Job name, so
            # the name carries no prefix. Downward API rather than a value: this is
            # the namespace by construction, and a value could say otherwise.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - { name: PROXY_HOST, value: {{ .Values.proxyHost | quote }} }
            # `key` and `secret` are not values: both Secrets are created out of
            # band, and a second place to spell a key is a second place to get it
            # wrong. The run key is the same Secret the proxy chart mounts — the
            # orchestrator derives the run credential from it and the proxy
            # recomputes it, so nothing is handed between them.
            - { name: RUN_KEY_FILE, value: /run/run-key/key }
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.webhook.secretName }}, key: secret }
            - { name: JOB_TEMPLATE_FILE, value: /run/job-template/job.yaml }
            {{- with .Values.toolchain }}
            # ponytail: one toolchain for the installation until ADR 0003's
            # detection lands — see values.yaml. Unset is legal.
            - { name: TOOLCHAIN, value: {{ . | quote }} }
            {{- end }}
          ports:
            # 8080 and not a value, as in the proxy's chart: the Service below
            # targets it and `serve` defaults to it.
            - containerPort: 8080
          # A route rather than a tcpSocket, unlike the proxy: this is an HTTP
          # server either way, so the cheaper probe buys nothing.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          # The half of "drained rather than dropped" that Go cannot do: SIGTERM and
          # the endpoint removal race, so without this a delivery arriving in that
          # window is refused — and GitHub does not retry, it only marks the delivery
          # failed. The `sleep` action needs no shell, which ko's base does not have.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          volumeMounts:
            - { name: run-key, mountPath: /run/run-key, readOnly: true }
            - { name: job-template, mountPath: /run/job-template, readOnly: true }
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: run-key
          secret: { secretName: {{ .Values.runKeySecretName }} }
        - name: job-template
          configMap: { name: {{ .Release.Name }}-job-template }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: { app: {{ .Release.Name }}, component: webhook }
  ports:
    - { port: 8080, targetPort: 8080 }
{{- /* No Ingress, and none is owed. How a delivery reaches this Service is the
       operator's ingress, gateway or tunnel, and every one of those is a different
       object with a different annotation vocabulary — a half-guessed Ingress here
       would be a thing to fight rather than a thing to use. e2e/95-webhook.sh
       POSTs at the Service directly, which is why it needs no public endpoint. */}}
{{- end }}

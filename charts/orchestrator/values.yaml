# The orchestrator's own image, which is the webhook front-end — `make
# orchestrator-image` builds and prints it.
#
# **Empty renders no Deployment and no Service**, and that is a supported shape
# rather than a broken one: what is left is the Job template, the ServiceAccount and
# the Role, which is the whole of what a command line needs. e2e stages 80 and 90
# install exactly that. One value decides it, so there is no enabled flag that can
# disagree with an image.
image: ""

# The webhook front-end's environment. What is *not* here is the point: it holds no
# GitHub credential at all — the authorization is two clauses on the payload and the
# refusal is silent, so there is nothing in this half that could write to GitHub.
# The informer half is the one that authenticates as the App, and it is still a
# command line (`orchestrator watch`); GITHUB_APP_ID, GITHUB_APP_PROVIDER and
# GITHUB_APP_KEY become values here when it joins this Deployment.
webhook:
  # The Secret holding the webhook secret, under the key `secret`. Created out of
  # band, like the run key, and **required** whenever there is an image: go-github
  # validates nothing when the secret is empty and no signature arrives, so an
  # unset one is an open trigger for anything that can reach the Service — with
  # every legitimate delivery still working, which is what makes it invisible.
  secretName: ""

# ponytail: ADR 0003's toolchain detection is a later ticket, so until it lands this
# is one answer for every repository the installation serves. Empty is legal and
# means the review phase runs with no language subagent. Detection deletes this
# value rather than defaulting it — it resolves a toolchain per repository, from the
# repository, which is also the first thing that gives this half a GitHub credential.
toolchain: ""

# The credential proxy's Service name as the *sandbox* resolves it — so a proxy in
# another namespace is `credential-proxy.other.svc.cluster.local`. The port is never
# configured: the sandbox is handed an `https_proxy` URL naming 8080, and a second
# place to change it is only a second place to get it wrong.
proxyHost: credential-proxy

# The one long-lived key the run credential derives from, and the proxy's chart
# mounts the same Secret (`runKeySecretName` there too, key `key`). Neither chart
# owns it. The orchestrator computes HMAC-SHA256(key, run) when it builds the Job
# and the proxy recomputes it from the pod's annotations, so nothing is handed
# between them and there is no per-run Secret.
runKeySecretName: proxy-run-key

# The front-end's own resources. It creates one object per delivery and holds no
# run state, so this is a listener's footprint and not a run's — the run's are
# under `sandbox` below.
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }

# The ConfigMap holding the CA that signed the proxy's serving certificate — only
# the certificate; the key stays in the proxy's Secret. Mounted at
# /run/proxy-ca/ca.crt, which the phase script concatenates onto the system roots
# to make the bundle every trust variable points at. Not optional: the sandbox
# reaches everything through the proxy, so a run without this CA verifies nothing.
proxyCAConfigMapName: proxy-ca

# The run's Job, as an operator's decisions rather than the orchestrator's. The
# builder patches only what is per-run — the name, run identity in two places, and
# the sandbox environment — so everything below is the whole of the posture.
job:
  # A run cannot be resumed, only re-created — the workspace is an emptyDir and the
  # branch may already be pushed, so a retry would be a second run wearing the
  # first one's identity and pushing over its work. A value because architecture
  # §9 makes every knob one, not because raising it is a supported thing to do.
  backoffLimit: 0

  # Counts from Job.status.startTime, so Pending time burns the run deadline.
  # ~6x headroom over a trivial three-phase run.
  activeDeadlineSeconds: 3600
  # A data-retention decision and not a tidiness one: deleting the Pod object
  # makes `pods/log` return NotFound, and MVP retains the transcript nowhere else.
  ttlSecondsAfterFinished: 86400

sandbox:
  # The sandbox image. No default: an image is a matched pair with the
  # orchestrator, so there is nothing sensible to guess. ADR 0003's per-toolchain
  # mapping is a later ticket; this is the one image today.
  #
  # Ours is built from `sandbox/` and published as
  # ghcr.io/nissessenap/implementer-base — pin the digest the publishing workflow
  # printed, not the moving :v1, because a tag can be re-pushed and the run records
  # what it actually ran. `make sandbox-image` builds it locally.
  image: ""

  # gVisor, and it is load-bearing rather than defence-in-depth — it is what makes
  # `seccompProfile: RuntimeDefault` and bubblewrap coexist. k3s names the class
  # after the containerd handler, so it lands as `runsc`; GKE needs a node pool
  # with `--sandbox type=gvisor`. Empty runs on the host runtime, which is a
  # deliberate downgrade and not a default worth having.
  runtimeClassName: runsc

  # The uid the run executes as, and it is a PodSpec field precisely so it is not
  # a constant in the orchestrator's Go — a BYO image may ship another one.
  # `fsGroup` is what makes the emptyDir volumes below writable by it: an emptyDir
  # mounts root:root 0755.
  uid: 1000

  # ponytail: $HOME and $WORKSPACE are literals in the Job template, not values —
  # the image bakes both paths and nothing sets them. Values when a second image
  # needs different ones.

  # ephemeral-storage alongside memory, because the three emptyDir volumes count
  # against it and the run plan writes one unbounded stream-json transcript per
  # phase into $WORKSPACE next to the clone and whatever the phases left behind.
  # Without a limit a runaway phase fills the node and evicts its neighbours.
  resources:
    requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi }
    limits: { memory: 6Gi, ephemeral-storage: 20Gi }

  # The e2e seam, and the one knob here that is not for operators: it replaces the
  # image's phase script with an inline shell script, so a stage can run a probe
  # container in a Job this chart and this builder produced. Only the e2e sets it —
  # stage 80 for the Job builder's probe, stage 90 for a run that writes a result
  # blob and two that never end on their own.
  script: ""

# Commit attribution. Here rather than in the builder because it is the operator's
# identity, not the run's — and `git` needs all four: the author and committer are
# separate people as far as it is concerned.
git:
  authorName: the-implementer
  authorEmail: the-implementer@users.noreply.github.com

# The model route. On, the sandbox is pointed at the proxy's `/vertex` and holds
# no model credential at all — not blanked, absent. The base URL is derived from
# proxyHost by the builder; these are the three things only the operator knows.
#
# The proxy's own chart must have `vertex.enabled` too, or the route is not there.
vertex:
  enabled: false
  projectId: ""
  # Vertex resolves `opus`/`sonnet` to its own defaults, so an operator who wants
  # specific models pins them — that is model config and belongs with the images.
  region: global

# The full image reference, digest and all: `make image` builds it with ko and
# prints exactly this string. One value rather than repository/tag/pullPolicy,
# because ko names the image itself — and because a rebuilt binary is a new
# digest, which is what makes a redeploy replace the pod on its own.
image: ko.local/proxy:latest

# The Secret cert-manager writes the serving certificate to. Its SANs *are* the
# intercept list, so this one value configures both — there is no host list here
# to drift out of step with the certificate.
tlsSecretName: proxy-leaf-tls

# The Secret holding the one long-lived key the run secret is derived from,
# mounted by this proxy and by the orchestrator. There is no per-run Secret: the
# orchestrator computes HMAC-SHA256(key, run) when it builds the Job and the proxy
# recomputes it here, so nothing is handed over between them. Created out of band
# like tlsSecretName above — this chart reads both Secrets and owns neither.
# Its key is `key`, fixed in the Deployment.
runKeySecretName: proxy-run-key

# The GitHub App the proxy mints installation tokens as — the production path.
# Every token it hands out is scoped to the repository the calling run's
# annotations name, so a compromised sandbox holds a credential for its own
# repository and nothing else.
#
# The App's private key never exists in this cluster. `provider` names who signs
# on the proxy's behalf and `key` is that signer's reference:
#
#   provider: gcp   key: projects/P/locations/L/keyRings/R/cryptoKeys/K/cryptoKeyVersions/1
#   provider: file  keySecretName: my-app-key   (a PKCS#1 PEM under the key `key`)
#
# The provider must also be *linked into the image* — `make image GO_TAGS=…`, see
# the Makefile. Naming one that is not is a boot failure, by name.
#
# Operator prerequisites for `gcp`, and the first is the one that bites: the KMS
# key is an **import**, not generate-in-place. GitHub generates the App's key pair
# and offers no bring-your-own-public-key, so the only way a KMS holds it is
# `gcloud kms keys versions import`. Which in turn means:
#
#   - purpose ASYMMETRIC_SIGN, algorithm RSA_SIGN_PKCS1_2048_SHA256, protection
#     level SOFTWARE (HSM cannot import a 2048-bit RSA key from GitHub's PEM)
#   - the proxy's Google service account needs roles/cloudkms.signerVerifier
#     *and* cloudkms.cryptoKeyVersions.get — the second is what the boot-time key
#     validation this proxy always enables costs
#   - reach it with Workload Identity: set serviceAccountAnnotations below to
#     iam.gke.io/gcp-service-account: proxy@PROJECT.iam.gserviceaccount.com
#
# Empty appId is a proxy that mints nothing.
githubApp:
  appId: ""
  provider: gcp
  key: ""
  # For `file` only, and the chart refuses to render otherwise: a Secret whose
  # `key` entry is a PKCS#1 PEM, mounted at /run/github-app/key and used as `key`
  # above. This is the e2e's path, and it is the one shape where the App's private
  # key exists in the cluster at all.
  keySecretName: ""

# Artifact Registry. On, the proxy attaches its own Google identity as a plain
# bearer to `{region}-go.pkg.dev` and `{region}-python.pkg.dev`, so the sandbox
# installs private packages holding no Google credential — not even a sentinel,
# because `pip` and `go mod download` send none and do not retry on a 401.
#
# `{region}-docker.pkg.dev` is on the same certificate and stays **tokenless**:
# its challenge/response fires only on unauthenticated requests, so attaching a
# bearer may suppress the dance. Unmeasured, and #28's.
#
# Off by default rather than "on whenever a Google credential happens to resolve":
# the certificate covers `*.pkg.dev` either way, so this is the operator's call.
#
# Operator prerequisites:
#
#   - `roles/artifactregistry.reader` on the proxy's Google service account. It is
#     the only new grant this needs — the token itself is the same identity that
#     signs the App JWT. **Grant it on the repository, not the project**, unless
#     you mean the project: unlike the GitHub credential, this one is not scoped
#     to the calling run — it is the proxy's own identity, so every run that
#     authenticates reaches everything the grant covers.
#   - reach it with Workload Identity: serviceAccountAnnotations below, exactly as
#     for the KMS key. **Not optional, and it fails quietly if you forget**: with
#     no binding the GKE metadata server hands this pod the *node's* service
#     account, so the proxy would attach an identity nobody chose — and it would
#     work, which is worse. There is no second identity here, and there is no key file:
#     a service account key in a Secret is the long-lived credential Workload
#     Identity exists to delete, and this chart offers nowhere to put one. A
#     cluster with no metadata server therefore cannot turn this on — which is why
#     the mechanism is proved with a fake token source in `go test` rather than
#     with a credential (see proxy/gar_test.go), and there is no e2e stage for it.
gar:
  enabled: false

# The model route: Vertex, terminated here. On, the proxy reverse-proxies the
# sandbox's model calls to Vertex with its own Google identity attached, so the
# sandbox holds no model credential at all — not blanked, absent. See ADR 0005.
#
# What the sandbox is given instead is five plain-config environment variables,
# and the orchestrator writes them (there is nothing to configure here):
#
#   ANTHROPIC_VERTEX_BASE_URL=http://<this release>:8080/vertex
#   ANTHROPIC_VERTEX_PROJECT_ID=<the project the identity below may invoke>
#   CLOUD_ML_REGION=<global, eu/us, or a region>
#   CLAUDE_CODE_USE_VERTEX=1
#   CLAUDE_CODE_SKIP_VERTEX_AUTH=1
#
# `http://` on purpose: the hop is cluster-internal and the request carries no
# credential in either direction, so there is nothing on it to protect. `no_proxy`
# must name this Service, or the base URL is tunnelled through the proxy to the
# proxy.
#
# Operator prerequisites:
#
#   - `roles/aiplatform.user` on the proxy's Google service account, on the
#     project `ANTHROPIC_VERTEX_PROJECT_ID` names. Like Artifact Registry and
#     unlike GitHub, this credential is **not scoped to the calling run** — it is
#     the proxy's own identity, so every run that authenticates reaches every
#     model the grant covers. The grant also carries `customJobs.create` and
#     friends, which is why the proxy forwards **model inference calls only** and
#     refuses every other Vertex path with a 400 — grant it on the project you
#     mean, and no wider.
#   - reach it with Workload Identity: serviceAccountAnnotations below. Not
#     optional, and it fails quietly if you forget — see gar above, the failure is
#     the same one and just as invisible. There is no key to mount, deliberately.
#   - **the models the project may invoke are the customer's, not our release.**
#     Vertex 404s a model the project has not enabled, and Claude Code resolves
#     `opus`/`sonnet` to its own defaults — so the sandbox's four model pins
#     (`ANTHROPIC_MODEL`, `ANTHROPIC_DEFAULT_OPUS_MODEL`,
#     `ANTHROPIC_DEFAULT_SONNET_MODEL`, `ANTHROPIC_DEFAULT_HAIKU_MODEL`) belong to
#     whoever writes the sandbox's environment. The opus alias in particular must
#     be remapped or `/code-review`'s subagents 404.
#   - `--max-budget-usd` still binds, but Claude Code computes cost locally at
#     Anthropic list rates: on Vertex it is a runaway guard, not the GCP bill.
vertex:
  enabled: false

  # The e2e seam, and the one knob that is not for operators. Set, every model
  # call goes here instead of to Google *and* the token attached is a worthless
  # stub — so a cluster with no metadata server can exercise this whole route,
  # while the seam cannot be a way to point a real credential at a host of
  # someone's choosing. e2e/70-vertex.sh is the only thing that sets it.
  upstream: ""

# Annotations for the proxy's ServiceAccount — Workload Identity's binding to a
# Google service account lives here, and nothing else does.
serviceAccountAnnotations: {}

# The Secret holding a static GitHub token the proxy swaps the sentinel for. The
# seam that keeps the swap testable with no App, no signer and no KMS — and not
# the production path: a static token is scoped to whatever the operator put in
# the Secret, where a minted one is scoped to the calling run's repository.
# Mutually exclusive with githubApp.appId: setting both fails the render, and
# fails cmd/proxy's boot for anyone deploying without this chart. There is no
# precedence rule, deliberately — the two are not interchangeable.
# Its key is `token`, fixed in the Deployment.
githubTokenSecretName: ""

resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { memory: 256Mi }

# Not under gVisor, and that is the point: the proxy is not the sandbox. It is the
# thing that holds the credential *because* the sandbox does not.
{{- /* Defaulted here, once: a values file that says `vault:` with nothing under it
       parses as nil, and every .Values.githubApp.vault.x below would panic on it
       rather than fail by name like the guards do. */}}
{{- $vault := .Values.githubApp.vault | default dict }}
{{- if and .Values.githubApp.appId .Values.githubTokenSecretName }}
{{- /* Refused here rather than resolved here. The two credentials are not
       interchangeable — one is scoped to the calling run's repository, the other
       to whatever the operator put in a Secret — so an `else` that quietly picked
       a winner would be the worst of the three answers. cmd/proxy refuses the
       same pair at boot, for anyone deploying without this chart. */}}
{{- fail "githubApp.appId and githubTokenSecretName are both set: the minted and static GitHub credentials are not interchangeable, pick one" }}
{{- end }}
{{- if and .Values.githubApp.appId (eq .Values.githubApp.provider "vault") (not (and $vault.addr $vault.tokenSecretName)) }}
{{- /* Both, and refused rather than defaulted, because both defaults are traps: no
       VAULT_ADDR and the client dials https://127.0.0.1:8200, which is *this pod*;
       no VAULT_TOKEN and it sends none at all. The environment is the provider's
       only configuration — ghait hands it no options and there is no AppRole or
       Kubernetes auth path here — so neither is a thing to supply another way. Both
       surface as a CrashLoop inside ghait's boot-time check, which is a worse place
       to read them than here. */}}
{{- fail "githubApp.provider is vault: it needs both githubApp.vault.addr and githubApp.vault.tokenSecretName, which are VAULT_ADDR and VAULT_TOKEN and the whole of the provider's configuration" }}
{{- end }}
{{- if and (or $vault.addr $vault.tokenSecretName) (ne .Values.githubApp.provider "vault") }}
{{- /* Values that would quietly do nothing, like vertex.upstream below: they are
       read by the vault provider alone, so this is either the wrong provider or the
       wrong values and neither should render. */}}
{{- fail "githubApp.vault is the vault provider's configuration; set githubApp.provider to vault or drop it" }}
{{- end }}
{{- if and .Values.githubApp.appId (not .Values.githubApp.key) }}
{{- fail "githubApp.appId is set with no key: githubApp.key is the signer's reference, and every provider needs one" }}
{{- end }}
{{- if and .Values.vertex.upstream (not .Values.vertex.enabled) }}
{{- /* The seam only means anything on the route it redirects. Rendered as
       written, it would be a value that quietly does nothing — and the way that
       is discovered is a model call reaching Google when the operator believed it
       was pointed at a mock. cmd/proxy refuses the same pair at boot. */}}
{{- fail "vertex.upstream is set with vertex.enabled false: the model route is off, so there is nothing to point anywhere" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # the nonroot user ko's base image ships
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: proxy
          image: "{{ .Values.image }}"
          # Not a value: ko tags by a hash of the binary, so nothing newer ever
          # appears under the reference above.
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - { name: TLS_DIR, value: /tls }
            # `key` and not a value: the Secret is created out of band, and a
            # second place to spell its key is a second place to get it wrong.
            - { name: RUN_KEY_FILE, value: /run/run-key/key }
            # The one namespace it watches pods in, and the one it serves runs
            # from. Downward API rather than a value: they are the same namespace
            # by construction, and a value could say otherwise.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            {{- if .Values.githubApp.appId }}
            # The minting path. The App's private key is not here and never is:
            # GITHUB_APP_KEY names a *signer's* key — a KMS crypto key version, or
            # a transit key — and the signer holds the private one. There is no
            # shape of this chart that mounts a PEM: the image drops ghait's
            # PEM-on-disk provider at build time (`ghait.no_file`, see the Makefile).
            - { name: GITHUB_APP_ID, value: "{{ .Values.githubApp.appId }}" }
            - { name: GITHUB_APP_PROVIDER, value: {{ .Values.githubApp.provider | quote }} }
            - { name: GITHUB_APP_KEY, value: {{ .Values.githubApp.key | quote }} }
            {{- if eq .Values.githubApp.provider "vault" }}
            # ghait hands the vault provider no options, so its client is
            # configured by the environment and these two are the whole of it —
            # which is why the guard above refuses to render without either. The
            # token is a Secret and the address is not: one is a credential and the
            # other is a hostname. `token` and not a value, as with the run key.
            - { name: VAULT_ADDR, value: {{ $vault.addr | quote }} }
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $vault.tokenSecretName }}, key: token }
            {{- end }}
            {{- end }}
            {{- if .Values.gar.enabled }}
            # Artifact Registry, on the proxy's own Google identity — Workload
            # Identity, via serviceAccountAnnotations, and nothing else: there is
            # no key file to mount, so a cluster with no metadata server cannot
            # turn this on at all.
            - { name: GAR_ENABLED, value: "true" }
            {{- end }}
            {{- if .Values.vertex.enabled }}
            # The model route. Same identity as GAR above, same Workload Identity
            # prerequisite, and one more grant: roles/aiplatform.user.
            - { name: VERTEX_ENABLED, value: "true" }
            {{- if .Values.vertex.upstream }}
            # The e2e seam: with this set no Google identity is resolved at all
            # and the token attached is a worthless stub. See values.yaml.
            - { name: VERTEX_UPSTREAM, value: {{ .Values.vertex.upstream | quote }} }
            {{- end }}
            {{- end }}
            {{- if .Values.githubTokenSecretName }}
            # Set only when there is a Secret to read: absent, the proxy binds no
            # credential to any host and every request comes out as the sandbox
            # sent it. `token` and not a value, as with the run key above.
            - { name: GITHUB_TOKEN_FILE, value: /run/github/token }
            {{- end }}
          ports:
            # 8080 and not a value: the sandbox is handed an `https_proxy` URL
            # naming this port, so a knob here is only a second place to change it.
            - containerPort: 8080
          # tcpSocket and not a /healthz route: the proxy has no dependency to
          # report on, so "the listener is up" is the whole of its health.
          readinessProbe:
            tcpSocket: { port: 8080 }
          volumeMounts:
            # Mounted, not copied: the kubelet refreshes this on renewal and the
            # proxy re-reads it per handshake, so a renewed certificate needs no
            # restart of this Deployment.
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: run-key, mountPath: /run/run-key, readOnly: true }
            {{- if .Values.githubTokenSecretName }}
            - { name: github-token, mountPath: /run/github, readOnly: true }
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tls
          secret: { secretName: {{ .Values.tlsSecretName }} }
        - name: run-key
          secret: { secretName: {{ .Values.runKeySecretName }} }
        {{- if .Values.githubTokenSecretName }}
        - name: github-token
          secret: { secretName: {{ .Values.githubTokenSecretName }} }
        {{- end }}

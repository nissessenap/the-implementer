# Not under gVisor, and that is the point: the proxy is not the sandbox. It is the
# thing that holds the credential *because* the sandbox does not.
{{- if and .Values.githubApp.appId .Values.githubTokenSecretName }}
{{- /* Refused here rather than resolved here. The two credentials are not
       interchangeable — one is scoped to the calling run's repository, the other
       to whatever the operator put in a Secret — so an `else` that quietly picked
       a winner would be the worst of the three answers. cmd/proxy refuses the
       same pair at boot, for anyone deploying without this chart. */}}
{{- fail "githubApp.appId and githubTokenSecretName are both set: the minted and static GitHub credentials are not interchangeable, pick one" }}
{{- end }}
{{- if and .Values.githubApp.appId .Values.githubApp.keySecretName (ne .Values.githubApp.provider "file") }}
{{- /* The same rule one level down. A mounted PEM is the `file` provider's key
       and nothing else's; against `gcp` it would set GITHUB_APP_KEY to a path
       where a crypto key version resource name belongs, and the failure would be
       a KMS name error naming a file. */}}
{{- fail "githubApp.keySecretName is the file provider's key; set githubApp.key for any other provider" }}
{{- end }}
{{- if and .Values.githubApp.appId (not (or .Values.githubApp.key .Values.githubApp.keySecretName)) }}
{{- fail "githubApp.appId is set with no key: give it githubApp.key, or githubApp.keySecretName for the file provider" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # the nonroot user ko's base image ships
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: proxy
          image: "{{ .Values.image }}"
          # Not a value: ko tags by a hash of the binary, so nothing newer ever
          # appears under the reference above.
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - { name: TLS_DIR, value: /tls }
            # `key` and not a value: the Secret is created out of band, and a
            # second place to spell its key is a second place to get it wrong.
            - { name: RUN_KEY_FILE, value: /run/run-key/key }
            # The one namespace it watches pods in, and the one it serves runs
            # from. Downward API rather than a value: they are the same namespace
            # by construction, and a value could say otherwise.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            {{- if .Values.githubApp.appId }}
            # The minting path. The App's private key is not here and never is:
            # GITHUB_APP_KEY names a signer's key — a KMS crypto key version, or
            # the mount path of a PEM Secret for the `file` provider.
            - { name: GITHUB_APP_ID, value: "{{ .Values.githubApp.appId }}" }
            - { name: GITHUB_APP_PROVIDER, value: {{ .Values.githubApp.provider | quote }} }
            {{- if .Values.githubApp.keySecretName }}
            - { name: GITHUB_APP_KEY, value: /run/github-app/key }
            {{- else }}
            - { name: GITHUB_APP_KEY, value: {{ .Values.githubApp.key | quote }} }
            {{- end }}
            {{- end }}
            {{- if .Values.gar.enabled }}
            # Artifact Registry, on the proxy's own Google identity — Workload
            # Identity, via serviceAccountAnnotations, and nothing else: there is
            # no key file to mount, so a cluster with no metadata server cannot
            # turn this on at all.
            - { name: GAR_ENABLED, value: "true" }
            {{- end }}
            {{- if .Values.githubTokenSecretName }}
            # Set only when there is a Secret to read: absent, the proxy binds no
            # credential to any host and every request comes out as the sandbox
            # sent it. `token` and not a value, as with the run key above.
            - { name: GITHUB_TOKEN_FILE, value: /run/github/token }
            {{- end }}
          ports:
            # 8080 and not a value: the sandbox is handed an `https_proxy` URL
            # naming this port, so a knob here is only a second place to change it.
            - containerPort: 8080
          # tcpSocket and not a /healthz route: the proxy has no dependency to
          # report on, so "the listener is up" is the whole of its health.
          readinessProbe:
            tcpSocket: { port: 8080 }
          volumeMounts:
            # Mounted, not copied: the kubelet refreshes this on renewal and the
            # proxy re-reads it per handshake, so a renewed certificate needs no
            # restart of this Deployment.
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: run-key, mountPath: /run/run-key, readOnly: true }
            {{- if and .Values.githubApp.appId .Values.githubApp.keySecretName }}
            - { name: github-app-key, mountPath: /run/github-app, readOnly: true }
            {{- end }}
            {{- if .Values.githubTokenSecretName }}
            - { name: github-token, mountPath: /run/github, readOnly: true }
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tls
          secret: { secretName: {{ .Values.tlsSecretName }} }
        - name: run-key
          secret: { secretName: {{ .Values.runKeySecretName }} }
        {{- if and .Values.githubApp.appId .Values.githubApp.keySecretName }}
        - name: github-app-key
          secret: { secretName: {{ .Values.githubApp.keySecretName }} }
        {{- end }}
        {{- if .Values.githubTokenSecretName }}
        - name: github-token
          secret: { secretName: {{ .Values.githubTokenSecretName }} }
        {{- end }}

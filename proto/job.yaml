# PROTOTYPE — throwaway. Placeholders are substituted by go.sh.
#
# Mirrors ADR 0002's primitive and ADR 0001's run-time posture as closely as the
# local cluster allows, because that posture is exactly what we are testing.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB__
  namespace: implementer-proto
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400 # keep the pod: deleting it makes pods/log NotFound
  template:
    spec:
      restartPolicy: Never
      __RUNTIME_CLASS__
      # One flow mapping, built by go.sh — see the POD_SECURITY comment there.
      securityContext: __POD_SECURITY__
      containers:
        - name: agent
          image: __IMG__
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/phase.sh"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          env:
            - name: REPO
              value: "__REPO__"
            - name: ISSUE
              value: "__ISSUE__"
            - name: PREFLIGHT_ONLY
              value: "__PREFLIGHT_ONLY__"
            - name: BRANCH_SUFFIX
              value: "__BRANCH_SUFFIX__"
            # The agent CLI refuses --dangerously-skip-permissions as uid 0. The
            # gate (read out of the 2.1.220 binary) is:
            #   getuid()===0 && IS_SANDBOX!=="1" && !CLAUDE_CODE_BUBBLEWRAP
            # so root is permitted inside a *deliberate* sandbox. A gVisor Job is
            # one. Harmless when running non-root; required when ROOT=1.
            - name: IS_SANDBOX
              value: "1"
            - name: HOME
              value: /home/agent
            - name: WORKSPACE
              value: /workspace
            - name: GIT_AUTHOR_NAME
              value: the-implementer
            - name: GIT_AUTHOR_EMAIL
              value: the-implementer@users.noreply.github.com
            - name: GIT_COMMITTER_NAME
              value: the-implementer
            - name: GIT_COMMITTER_EMAIL
              value: the-implementer@users.noreply.github.com
          envFrom:
            - secretRef:
                name: proto-creds
            # Run knobs; also the Vertex + proxy config when VERTEX=1. See go.sh.
            - configMapRef:
                name: proto-env
          volumeMounts:
            - { name: home, mountPath: /home/agent }
            - { name: tmp, mountPath: /tmp }
            - { name: workspace, mountPath: /workspace }
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { memory: 6Gi }
      volumes:
        - { name: home, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: workspace, emptyDir: {} }

# The sandbox images' repeatable build: the base, plus ADR 0003's three language
# derivatives. On a pull request it builds and throws the result away; on a tag it
# publishes the moving :v1 alongside the immutable :v1.2.3 and prints the digests,
# because ADR 0001 has Helm default to the immutable reference and the orchestrator
# record the digest it actually ran — tags can be re-pushed, and an eval result
# citing a mutable tag is not honest.
#
# One job and not four, so the derivatives are built `FROM` the base this run just
# produced rather than from a published one: the four images are a matched set out
# of one build graph, and there is no chicken-and-egg on the very first tag.
name: sandbox-image

on:
  pull_request:
    paths: ['sandbox/**', '.github/workflows/sandbox-image.yaml']
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Only the publishing half needs it, and a pull_request from a fork gets it
      # read-only regardless — which is why that half is gated on the event below.
      packages: write
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One build of the base, and the three derivatives `FROM` that exact image.
      # `docker build` throughout, and build-push-action for none of it: that action
      # pushes what it builds, so the local tag the derivatives need would have to
      # come from a *second* build of the same context — and nothing enforces that
      # the second one is the first one. A cache miss there (another buildx driver,
      # an evicted cache, a `apt-get update` layer that busts) publishes
      # implementer-go:v1.2.3 derived from a base nobody can pull, while the
      # summary prints the other base's digest. Build once, tag from it, push tags.
      #
      # Publishing is a separate step below rather than a `push:` flag here, because
      # a pull request builds all four and pushes none of them.
      - name: the images
        run: |
          set -eu
          docker build -q -t implementer-base:ci sandbox
          for l in go node python; do
            docker build -q --build-arg BASE=implementer-base:ci -t "implementer-$l:ci" "sandbox/$l"
          done

      # ADR 0001's contract, checked rather than trusted — including on the base,
      # which is where the run plan's own preflight is asserted to still pass.
      - name: the image contract
        run: |
          set -eu
          sandbox/contract.sh implementer-base:ci
          for l in go node python; do sandbox/contract.sh "implementer-$l:ci" "$l"; done

      # All four under the same two tags and from the same run, so a
      # `sandbox.images` map is one version across the set. The digest each push
      # prints is the one Helm should pin: `docker push` reports the digest of what
      # it actually stored, which `docker inspect` cannot when two tags share it.
      #
      # No `latest`, deliberately: a floating third tag on an image whose whole
      # posture is digest-pinning. The moving major is skipped for a prerelease, and
      # that is not tidiness either — pushing `:v2` for a release candidate would
      # leave `:v2` resolving to one, which is the matched set this job exists to
      # keep pointed at something a human meant to ship.
      - name: publish
        if: github.event_name == 'push'
        run: |
          set -eu
          v=${GITHUB_REF_NAME#v}
          for l in base go node python; do
            img=ghcr.io/${{ github.repository_owner }}/implementer-$l
            case $v in
              *-*) ;;
              *) docker tag "implementer-$l:ci" "$img:v${v%%.*}"
                 docker push -q "$img:v${v%%.*}" ;;
            esac
            docker tag "implementer-$l:ci" "$img:v$v"
            d=$(docker push "$img:v$v" | awk '/digest: /{print $3}')
            echo "$img@$d" >> "$GITHUB_STEP_SUMMARY"
          done

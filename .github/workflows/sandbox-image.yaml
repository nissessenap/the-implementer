# The sandbox base image's repeatable build. On a pull request it builds and throws
# the result away; on a tag it publishes the moving :v1 alongside the immutable
# :v1.2.3 and prints the digest, because ADR 0001 has Helm default to the immutable
# reference and the orchestrator record the digest it actually ran — tags can be
# re-pushed, and an eval result citing a mutable tag is not honest.
name: sandbox-image

on:
  pull_request:
    paths: ['sandbox/**', '.github/workflows/sandbox-image.yaml']
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/implementer-base

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Only the publishing half needs it, and a pull_request from a fork gets it
      # read-only regardless — which is why that half is gated on the event below.
      packages: write
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The immutable reference and the moving major, from the tag itself. A
          # workflow_dispatch or a pull request gets neither and builds unpushed.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # The one line an operator needs: `sandbox.image` in charts/orchestrator.
      - if: steps.build.outputs.digest != ''
        run: echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

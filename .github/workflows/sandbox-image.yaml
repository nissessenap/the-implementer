# The sandbox images' repeatable build: the base, plus ADR 0003's three language
# derivatives. On a pull request it builds and throws the result away; on a tag it
# publishes the moving :v1 alongside the immutable :v1.2.3 and prints the digests,
# because ADR 0001 has Helm default to the immutable reference and the orchestrator
# record the digest it actually ran — tags can be re-pushed, and an eval result
# citing a mutable tag is not honest.
#
# One job and not four, so the derivatives are built `FROM` the base this run just
# produced rather than from a published one: the four images are a matched set out
# of one build graph, and there is no chicken-and-egg on the very first tag.
name: sandbox-image

on:
  pull_request:
    paths: ['sandbox/**', '.github/workflows/sandbox-image.yaml']
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/implementer-base

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Only the publishing half needs it, and a pull_request from a fork gets it
      # read-only regardless — which is why that half is gated on the event below.
      packages: write
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Exactly these two, and no `latest`: the action's default flavor is
          # `latest=auto`, which would publish a third, floating tag on an image
          # whose whole posture is digest-pinning.
          flavor: latest=false
          # The immutable reference and the moving major, from the tag itself. A
          # workflow_dispatch or a pull request gets neither and builds unpushed.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The three language images, from the base above. `docker build` rather than
      # the action: the local tag the derivatives need is not one that may ever be
      # pushed, and the whole of the tagging logic below is two shell parameter
      # expansions against the git tag. The base rebuild here is a full cache hit —
      # same daemon, same buildkit, same context.
      - name: the language images
        run: |
          set -eu
          docker build -q -t implementer-base:ci sandbox
          for l in go node python; do
            docker build -q --build-arg BASE=implementer-base:ci -t "implementer-$l:ci" "sandbox/$l"
          done

      # ADR 0001's contract, checked rather than trusted — including on the base,
      # which is where the run plan's own preflight is asserted to still pass.
      - name: the image contract
        run: |
          set -eu
          sandbox/contract.sh implementer-base:ci
          for l in go node python; do sandbox/contract.sh "implementer-$l:ci" "$l"; done

      # Published under the same tags as the base and from the same run, so a
      # `sandbox.images` map is one version across all three. The digest each push
      # prints is the one Helm should pin: `docker push` reports the digest of what
      # it actually stored, which `docker inspect` cannot when two tags share it.
      #
      # The moving major is skipped for a prerelease, and that is not tidiness:
      # metadata-action's `{{major}}` emits nothing for one, so pushing `:v2` here
      # unconditionally would leave `implementer-go:v2` on a release candidate
      # while `implementer-base:v2` still resolved to the last stable — the exact
      # matched set this whole job exists to keep.
      - name: publish the language images
        if: github.event_name == 'push'
        run: |
          set -eu
          v=${GITHUB_REF_NAME#v}
          for l in go node python; do
            img=ghcr.io/${{ github.repository_owner }}/implementer-$l
            case $v in
              *-*) ;;
              *) docker tag "implementer-$l:ci" "$img:v${v%%.*}"
                 docker push -q "$img:v${v%%.*}" ;;
            esac
            docker tag "implementer-$l:ci" "$img:v$v"
            d=$(docker push "$img:v$v" | awk '/digest: /{print $3}')
            echo "$img@$d" >> "$GITHUB_STEP_SUMMARY"
          done
      # The one line an operator needs: `sandbox.image` in charts/orchestrator.
      # Gated on the same event as the push above: a pull-request build produces a
      # digest too, and printing one for an image nobody can pull is worse than
      # printing nothing.
      - if: github.event_name == 'push'
        run: echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

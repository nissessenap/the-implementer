name: e2e

on: pull_request

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Pinned to go.mod rather than the runner image's Go, which client-go's
      # own minimum has already outrun once.
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - run: make test
      - run: make kind-up
      - run: make e2e
      # The cluster dies with the runner, so anything not printed here is gone.
      - if: failure()
        run: kubectl get pod -A -o wide

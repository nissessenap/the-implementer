# Stage 70's fixture. Applied by e2e/70-gar-inject.sh, which substitutes
# __RUNTIME_CLASS__, __RUN_CRED__, __INDEX__, __PACKAGE__ and __DOCKER_HOST__.
#
# What is not in it is the point, and it is stricter than stage 50's: no Google
# credential, and no sentinel either. `pip` sends Artifact Registry nothing at all,
# so there is nothing here for the proxy to swap — it attaches.
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-gar
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      annotations:
        implementer.dev/owner: acme
        implementer.dev/repo: widgets
        implementer.dev/issue: "5"
        implementer.dev/run-uid: stage70
    spec:
      restartPolicy: Never
      __RUNTIME_CLASS__
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        # The assertion the whole ticket is for: a real private wheel, installed
        # from a repository this pod cannot authenticate to.
        - name: pip
          image: python:3.13-alpine
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - { name: HOME, value: /tmp }
            # PIP_CERT, because pip verifies against its own bundled certifi and
            # ignores the system store — SSL_CERT_FILE alone leaves it failing the
            # handshake with the proxy's certificate.
            - { name: PIP_CERT, value: /tmp/trust-bundle.crt }
            - { name: https_proxy, value: "http://__RUN_CRED__@credential-proxy:8080" }
            - { name: INDEX, value: "__INDEX__" }
            - { name: PACKAGE, value: "__PACKAGE__" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: proxy-ca, mountPath: /run/proxy-ca, readOnly: true }
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              cat /etc/ssl/certs/ca-certificates.crt /run/proxy-ca/ca.crt > /tmp/trust-bundle.crt

              # --target, because the root filesystem is read-only and site-packages
              # is on it. --no-deps, because a private wheel's dependencies may live
              # on PyPI and this is not a test of PyPI.
              pip install --quiet --no-cache-dir --no-deps \
                --index-url "$INDEX" --target /tmp/wheel "$PACKAGE" \
                || { echo "!!! FAIL: the private install failed — no credential was attached"; exit 1; }
              echo "PROBE pip-install      ok   (private wheel, and this pod holds no Google credential)"
              ls /tmp/wheel

        # The exclusion, and it is the load-bearing half: the same wildcard
        # certificate covers this host, and only the credential rule keeps it
        # tokenless. Its challenge fires *only* on unauthenticated requests, so a
        # 200 here would mean the proxy had suppressed the dance it does not yet
        # know how to answer (#28).
        - name: docker-challenge
          image: curlimages/curl:8.21.0
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - { name: CURL_CA_BUNDLE, value: /tmp/trust-bundle.crt }
            - { name: https_proxy, value: "http://__RUN_CRED__@credential-proxy:8080" }
            - { name: DOCKER_HOST_NAME, value: "__DOCKER_HOST__" }
          volumeMounts:
            - { name: docker-tmp, mountPath: /tmp }
            - { name: proxy-ca, mountPath: /run/proxy-ca, readOnly: true }
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              cat /etc/ssl/certs/ca-certificates.crt /run/proxy-ca/ca.crt > /tmp/trust-bundle.crt
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                "https://$DOCKER_HOST_NAME/v2/")
              [ "$code" = 401 ] || { echo "!!! FAIL: /v2/ answered $code, want 401 — a token was attached to -docker.pkg.dev"; exit 1; }
              echo "PROBE docker-v2        401  (intercepted, tokenless, challenge intact)"
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: docker-tmp, emptyDir: {} }
        - name: proxy-ca
          configMap: { name: proxy-ca }

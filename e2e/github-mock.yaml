# GitHub, as far as the orchestrator is concerned. Applied by e2e/90-informer.sh,
# which substitutes nothing.
#
# A stub that *asserts requests*, not a GitHub emulator. The question worth
# answering in a cluster is "did the orchestrator decide correctly and call
# correctly" — method, path, and the body it sent — and a faithful emulator drifts
# from GitHub until the suite is testing the emulator. It answers the four calls
# the informer makes and records every one of them for the stage to read back:
#
#   GET  /repos/{owner}/{repo}/installation            which installation has it
#   POST /app/installations/{id}/access_tokens         the mint
#   GET  /repos/{owner}/{repo}/issues/{n}/comments     have I already reported
#   POST /repos/{owner}/{repo}/issues/{n}/comments     the comment
#
# Plus two of its own, for the harness rather than the orchestrator: `GET /_calls`
# is the tape, and `POST /_reset` empties both it and the thread. The reset is what
# makes a stage's assertions independent of every run before it — this Deployment is
# left standing between stages so later tickets add assertions rather than
# infrastructure, and in-process state that outlived a stage would otherwise make
# "exactly one comment" count the last run's too.
#
# The thread is real state: a POST is readable by the next GET, which is what makes
# the exactly-once assertion mean anything — the marker in the comment is the only
# record the orchestrator has that a run was reported.
#
# This is the precedent stage 70 set for the model route, for the reason CLAUDE.md
# records: a stage that needs a real credential is a stage that skips, and a skipped
# stage proves nothing. It does not replace the real-GitHub stages — the mock answers
# "did we call correctly", only real GitHub answers "does GitHub accept this".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mock
spec:
  replicas: 1
  selector:
    matchLabels: { app: github-mock }
  template:
    metadata:
      labels: { app: github-mock }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mock
          image: python:3.13-slim
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /_calls, port: 8080 }
          command: ["python3", "-u", "-c"]
          args:
            - |
              # One replica and in-process state, deliberately: the thread has to be
              # readable by the next request or the dedupe assertion is vacuous.
              import json, re, time
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              CALLS = []            # "METHOD /path auth=<kind>", in order
              THREAD = {}           # (owner, repo, issue) -> [comment, ...]

              # What a comment the App wrote looks like coming back. The informer
              # counts only its own comments as a report, because the marker is in
              # the comment and so is not a secret: anyone who can comment could
              # otherwise silence a run by posting the marker first.
              APP = {"login": "implementer[bot]", "id": 1, "type": "Bot"}

              INSTALL = re.compile(r"^/repos/([^/]+)/([^/]+)/installation$")
              MINT = re.compile(r"^/app/installations/(\d+)/access_tokens$")
              COMMENTS = re.compile(r"^/repos/([^/]+)/([^/]+)/issues/(\d+)/comments$")

              class H(BaseHTTPRequestHandler):
                  protocol_version = "HTTP/1.1"

                  def reply(self, code, obj):
                      body = json.dumps(obj).encode() if not isinstance(obj, bytes) else obj
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  # go-github sends `?sort=…&direction=…&per_page=…` on the read, so
                  # every match and every recorded line is on the path alone.
                  def route(self):
                      return self.path.split("?", 1)[0]

                  def record(self):
                      # The *kind* of credential, never the credential: an App JWT and
                      # an installation token are both bearers and the informer must
                      # use each on its own half, so which one arrived is the
                      # assertion and the bytes are nobody's business.
                      a = self.headers.get("Authorization", "")
                      kind = "none"
                      if a.startswith("Bearer ") and a.count(".") == 2:
                          kind = "app-jwt"
                      elif a.startswith("Bearer "):
                          kind = "token"
                      CALLS.append("%s %s auth=%s" % (self.command, self.route(), kind))

                  def do_GET(self):
                      if self.route() == "/_calls":
                          # Not recorded: the harness reading the tape is not a call the
                          # orchestrator made.
                          return self.reply(200, ("\n".join(CALLS) + "\n").encode())
                      self.record()
                      if m := INSTALL.match(self.route()):
                          return self.reply(200, {"id": 4242, "app_id": 1,
                                                  "account": {"login": m.group(1)}})
                      if m := COMMENTS.match(self.route()):
                          thread = THREAD.get(m.groups(), [])
                          # One page, no Link header: this stage's threads are short.
                          # That the informer reads to the *end* of a long one is
                          # orchestrator/informer_test.go's, which can build a
                          # 250-comment thread for nothing.
                          return self.reply(200, [{"id": i + 1, "body": b, "user": APP}
                                                  for i, b in enumerate(thread)])
                      self.reply(404, {"message": "Not Found"})

                  def do_POST(self):
                      if self.route() == "/_reset":
                          CALLS.clear()
                          THREAD.clear()
                          return self.reply(200, {"reset": True})
                      self.record()
                      n = int(self.headers.get("Content-Length") or 0)
                      raw = self.rfile.read(n)
                      if MINT.match(self.route()):
                          exp = time.strftime("%Y-%m-%dT%H:%M:%SZ",
                                              time.gmtime(time.time() + 3600))
                          return self.reply(201, {"token": "ghs_mock_installation_token",
                                                  "expires_at": exp,
                                                  "permissions": {"issues": "write"}})
                      if m := COMMENTS.match(self.route()):
                          body = json.loads(raw or b"{}").get("body", "")
                          THREAD.setdefault(m.groups(), []).append(body)
                          return self.reply(201, {"id": len(THREAD[m.groups()]),
                                                  "body": body, "user": APP})
                      self.reply(404, {"message": "Not Found"})

                  def log_message(self, fmt, *a):
                      print("github-mock: " + fmt % a)

              ThreadingHTTPServer(("", 8080), H).serve_forever()
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: github-mock
spec:
  selector: { app: github-mock }
  ports:
    - { port: 8080, targetPort: 8080 }
